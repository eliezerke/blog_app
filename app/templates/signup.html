{% extends "base.html" %}
{% block title %}Join - Visual Quotes{% endblock %}
{% block content %}

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <a href="{{ url_for('index') }}" class="auth-logo"><span class="logo-mark"><img src="{{ url_for('static', filename='/assets/images/top.png') }}" alt="Visual Quotes Logo"/></span></a>
      <h1>Join the team.</h1>
      <p>Create an account to like and comment.</p>
    </div>

    <!-- Google Sign Up -->
    <a href="{{ url_for('google_login') }}" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/><path d="M3.964 10.706c-.18-.54-.282-1.117-.282-1.706s.102-1.166.282-1.706V4.962H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.038l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.962L3.964 6.294C4.672 4.167 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
      Sign up with Google
    </a>

    <div class="auth-divider"><span>or</span></div>

    <form method="POST" class="auth-form">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required autocomplete="name"/>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email"/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password"/>
      </div>
      <button type="submit" class="btn-primary btn-full">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>

{% endblock %}
